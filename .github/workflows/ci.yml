name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
        miniforge-version: latest
        activate-environment: test-env
        environment-file: environment.yml

    - name: Install dependencies
      shell: bash -el {0}
      run: |
        conda info
        conda list
        conda install -y pytest pytest-cov pytest-mock

    - name: Install package
      shell: bash -el {0}
      run: |
        pip install -e .

    - name: Run tests
      shell: bash -el {0}
      run: |
        pytest tests/ -v --cov=taxcalc --cov-report=term-missing
      env:
        PYTHONPATH: .

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: "3.11"
        miniforge-version: latest
        activate-environment: lint-env

    - name: Install linting tools
      shell: bash -el {0}
      run: |
        conda install -y black flake8 isort mypy

    - name: Check formatting with black
      shell: bash -el {0}
      run: |
        black --check --diff . || echo "::warning::Code formatting issues found"
      continue-on-error: true

    - name: Check imports with isort
      shell: bash -el {0}
      run: |
        isort --check-only --diff . || echo "::warning::Import sorting issues found"
      continue-on-error: true

    - name: Lint with flake8
      shell: bash -el {0}
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "::warning::Linting issues found"
      continue-on-error: true

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()

    steps:
    - name: Summary
      run: |
        echo "## CI Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY

        if [[ "${{ needs.test.result }}" == "success" ]]; then
          echo "All tests passed!" >> $GITHUB_STEP_SUMMARY
        else
          echo "Issues found" >> $GITHUB_STEP_SUMMARY
        fi
